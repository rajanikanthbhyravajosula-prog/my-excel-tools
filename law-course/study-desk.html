<style>
/* Layout: a reading desk. Class list on the left, one reading column, highlighter-yellow notes. */
:root {
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #18222F;
  --muted: #5B6676;
  --line: #DCE1E8;
  --accent: #1F3A5F;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EDF6;
  --mark: #FFE58A;
  --mark-ink: #3F3200;
  --callout: #FFF8DF;
  --danger: #B3261E;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141B; --surface: #161D27; --ink: #E6EBF2; --muted: #9AA6B5; --line: #2A3442;
    --accent: #8FB3E0; --accent-ink: #0F141B; --accent-soft: #1C2A3B;
    --mark: #6B5A12; --mark-ink: #FFF1B8; --callout: #2A2614; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #161D27; --ink: #E6EBF2; --muted: #9AA6B5; --line: #2A3442;
  --accent: #8FB3E0; --accent-ink: #0F141B; --accent-soft: #1C2A3B;
  --mark: #6B5A12; --mark-ink: #FFF1B8; --callout: #2A2614; --danger: #FF8A80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
select { max-width: 100%; min-width: 0; }
.compose > *, .compose .row > * { min-width: 0; }
.filters select { flex: 1 1 180px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 10px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.brand { font-family: var(--font-read); font-weight: 700; font-size: 1.15rem; color: var(--accent); margin-right: auto; }
.tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 6px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.count { font-variant-numeric: tabular-nums; }

.wrap { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 20px 120px; max-width: 1180px; margin: 0 auto; }
.read-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: start; }
nav.classes { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); display: flex; flex-direction: column; gap: 2px; }
nav.classes .label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 10px 10px 4px; }
nav.classes button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 6px; color: var(--ink); line-height: 1.3; }
nav.classes button:hover { background: var(--accent-soft); }
nav.classes button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.class-select { display: none; width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 14px; }
.hint { font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 18px; }
.hint b { color: var(--ink); }

article.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px; min-width: 0; font-family: var(--font-read); font-size: 1.03rem; line-height: 1.62; }
article.lesson h1 { font-size: 1.7rem; line-height: 1.2; margin: 0 0 6px; color: var(--accent); text-wrap: balance; }
article.lesson .sub { font-style: italic; color: var(--muted); margin: 0 0 18px; font-size: 0.95rem; }
article.lesson h2 { font-size: 1.28rem; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); color: var(--accent); text-wrap: balance; scroll-margin-top: 90px; }
article.lesson h3 { font-size: 1.08rem; margin: 20px 0 6px; text-wrap: balance; scroll-margin-top: 90px; }
article.lesson p { margin: 0 0 10px; max-width: 70ch; }
article.lesson ul, article.lesson ol { margin: 0 0 12px; padding-left: 1.4em; max-width: 70ch; }
article.lesson li { margin: 3px 0; }
article.lesson li.sub2 { margin-left: 1.4em; list-style: circle; }
article.lesson .callout { background: var(--callout); border-left: 4px solid #B8860B; border-radius: 6px; padding: 10px 14px; margin: 10px 0 14px; }
.table-wrap { overflow-x: auto; margin: 6px 0 16px; border: 1px solid var(--line); border-radius: 8px; }
article.lesson table { border-collapse: collapse; width: 100%; font-family: var(--font-ui); font-size: 0.86rem; line-height: 1.4; }
article.lesson th { background: var(--accent); color: var(--accent-ink); text-align: left; font-weight: 600; padding: 7px 10px; }
article.lesson td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: top; }
article.lesson tr:nth-child(even) td { background: var(--accent-soft); }
article.lesson ::selection { background: var(--mark); color: var(--mark-ink); }
article.lesson .has-note { box-shadow: inset 3px 0 0 var(--mark); }

/* Selection bar */
.selbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 18px rgba(0,0,0,0.08);
}
.selbar .inner { max-width: 1180px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.selbar .preview { flex: 1 1 260px; min-width: 0; font-family: var(--font-read); font-size: 0.92rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.selbar .preview mark { background: var(--mark); color: var(--mark-ink); padding: 0 3px; border-radius: 3px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 500; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.mark { background: var(--mark); color: var(--mark-ink); border-color: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 0.84rem; }
.btn:disabled { opacity: 0.5; cursor: default; }

/* Notes view */
.notes-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.notes-head h1 { font-family: var(--font-read); font-size: 1.5rem; margin: 0 auto 0 0; color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.filters input[type="search"], .filters select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.filters label { display: flex; gap: 6px; align-items: center; font-size: 0.9rem; color: var(--muted); }
.store-status { font-size: 0.8rem; color: var(--muted); }
.group { margin-bottom: 26px; }
.group h2 { font-family: var(--font-read); font-size: 1.1rem; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
.group h2 .n { font-family: var(--font-ui); font-size: 0.8rem; color: var(--muted); font-weight: 400; }
.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card.important { border-left: 4px solid #B8860B; }
.card .quote { font-family: var(--font-read); font-size: 1rem; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.card .quote mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 2px; }
.card .own { margin-top: 10px; padding: 8px 12px; background: var(--accent-soft); border-radius: 6px; font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.card .own b { color: var(--accent); }
.card .meta { margin-top: 10px; font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.card .actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.card textarea, .compose textarea { width: 100%; min-height: 80px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; }
.compose { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 18px; display: grid; gap: 10px; }
.compose .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.compose select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty b { color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem; }

@media (max-width: 860px) {
  .read-layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
  nav.classes { display: none; }
  .class-select { display: block; }
  article.lesson { padding: 20px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { transition: opacity 0.2s; }
}

        <select class="class-select" id="class-select" aria-label="Choose a class"></select>

  <section id="view-notes" hidden>

      <label><input type="checkbox" id="filter-important"> Important only</label>

    <div id="notes-list"></div>

</main>

<div class="selbar" id="selbar" hidden>

    <button class="btn primary" id="sel-add">Add to notes</button>
  </div>
</div>
